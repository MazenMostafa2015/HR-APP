<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ELMS Desktop Setup</title>
  <style>
    :root { font-family: Segoe UI, Arial, sans-serif; color: #17313a; background: #f5f7f8; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(560px, calc(100vw - 48px)); padding: 42px; background: white; border: 1px solid #dce6e8; border-radius: 18px; box-shadow: 0 18px 50px rgba(22, 48, 56, .12); }
    .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: #1b8e8a; color: white; font-size: 24px; font-weight: 800; }
    h1 { margin: 22px 0 8px; font-size: 30px; } p { color: #587078; line-height: 1.55; }
    label { display: block; margin-top: 26px; font-weight: 700; font-size: 14px; }
    input { box-sizing: border-box; width: 100%; margin-top: 8px; padding: 13px 14px; border: 1px solid #b9cdd1; border-radius: 9px; font-size: 16px; }
    button { margin-top: 18px; padding: 13px 18px; border: 0; border-radius: 9px; background: #1b8e8a; color: white; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; } #message { min-height: 24px; margin-top: 14px; color: #b53a3a; }
    .hint { margin-top: 24px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">E</div>
    <h1>Connect to your ELMS server</h1>
    <p>Enter the address provided by your IT administrator. The desktop application stores only this address; all data, authentication, approvals, and attachments remain on the internal server.</p>
    <form id="form">
      <label for="serverUrl">Internal server URL</label>
      <input id="serverUrl" type="url" required placeholder="https://elms.company.local" autocomplete="url" />
      <button id="save" type="submit">Open ELMS</button>
      <div id="message" role="alert"></div>
    </form>
    <p class="hint">Use HTTPS whenever possible. Example: <strong>https://elms-server.company.local</strong></p>
  </main>
  <script>
    const form = document.querySelector('#form');
    const input = document.querySelector('#serverUrl');
    const button = document.querySelector('#save');
    const message = document.querySelector('#message');
    window.elmsDesktop.getConfig().then(config => { input.value = config.serverUrl || ''; });
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); button.disabled = true; message.textContent = 'Connecting…';
      const result = await window.elmsDesktop.saveConfig(input.value);
      if (!result.ok) { button.disabled = false; message.textContent = result.error; }
    });
  </script>
</body>
</html>
