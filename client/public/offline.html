<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F766E" />
    <title>Offline — SLL-Consult ELMS</title>
    <style>
      :root { color-scheme: light; font-family: Segoe UI, Arial, sans-serif; color: #163b39; background: #f3f8f7; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 520px); padding: 36px; border: 1px solid #d7e7e3; border-radius: 20px; background: #fff; box-shadow: 0 18px 50px rgba(15, 72, 67, .08); text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 16px; background: #0F766E; color: #fff; font-weight: 800; letter-spacing: -.06em; }
      h1 { margin: 0 0 12px; color: #0F766E; font-size: clamp(1.35rem, 4vw, 1.8rem); }
      p { margin: 0 0 24px; line-height: 1.6; color: #526766; }
      button { border: 0; border-radius: 10px; padding: 11px 18px; background: #0F766E; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover { background: #115e59; }
      footer { margin-top: 28px; color: #71817f; font-size: .8rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ELMS</div>
      <h1>SLL-Consult ELMS</h1>
      <p>You are offline — SLL-Consult ELMS will resume when your connection returns.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <footer>© 2026 SLL-Consult — Internal Use Only</footer>
    </main>
  </body>
</html>
